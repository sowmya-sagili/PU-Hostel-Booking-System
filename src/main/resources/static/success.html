<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Booking Successful</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .success-box { text-align: center; padding: 20px; }
    .success-box h2 { color: green; font-size: 24px; margin-bottom: 15px; }
    .success-box p { font-size: 18px; }
    button { padding: 10px 20px; margin-top: 20px; background: #004aad; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background: #003080; }
  </style>
</head>
<body>
<header class="topbar">
  <img src="assets/pu_logo.jpeg" class="logo" alt="Logo">
  <h1>Booking Confirmation</h1>
</header>

<main class="container">
  <div class="card success-box">
    <h2>🎉 Thank You for Your Booking!</h2>
    <p>Your hostel booking is successfully confirmed.</p>
    <p>You will receive a confirmation email shortly.</p>
    
    <button onclick="window.location.href='/'">Go to Home</button>
    <button id="downloadReceiptBtn" style="background: #28a745; margin-left: 10px;">Download Booking Receipt</button>
  </div>
</main>

<script>
  document.getElementById("downloadReceiptBtn").addEventListener("click", function() {
      const bookingData = JSON.parse(localStorage.getItem("bookingData"));
      if (!bookingData || !bookingData.booking_id) {
          alert("No booking reference found in your browser. Please contact the administrator.");
          return;
      }
      window.location.href = `/api/booking/receipt/${bookingData.booking_id}`;
  });
</script>

</body>
</html>
